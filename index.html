<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drive Sim</title>
<link rel="stylesheet" href="./hud.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="hud">
  <div id="help" class="panel">
    <div><kbd>W</kbd>/<kbd>S</kbd> gas / brake</div>
    <div><kbd>A</kbd>/<kbd>D</kbd> steer</div>
    <div><kbd>Space</kbd> handbrake</div>
    <div><kbd>R</kbd> reset · <kbd>H</kbd> hide help · <kbd>G</kbd> grid</div>
    <div>Drag: orbit cam · Wheel: zoom · Dbl-click: reset cam</div>
    <div><kbd>B</kbd> save path · <kbd>C</kbd> clear saved</div>
    <div><kbd>T</kbd> start/stop trail · <kbd>X</kbd> clear trails</div>
    <div><kbd>P</kbd> save frame</div>
  </div>
  <div id="status" class="panel">
    <span id="roadState" class="ok">On road</span>
    <span id="hits">Collisions: 0</span>
    <span id="recState" class="bad" style="display:none">● REC</span>
  </div>
  <div id="toast" class="panel"></div>
  <div id="minimap" class="panel"><canvas width="340" height="340"></canvas></div>
  <div id="limit">60</div>
  <div id="gauge" class="panel">
    <canvas width="440" height="440"></canvas>
    <div class="readout"><div id="speed">0</div><small>KM/H</small><div id="gear">P</div></div>
  </div>
  <div id="pedals" class="panel">
    <div class="bar" id="brk"><i></i></div>
    <div class="bar" id="thr"><i></i></div>
    <div id="wheel"></div>
  </div>
  <button id="snap" class="panel" title="Download the current frame (P)">📷 Save frame</button>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
